<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-labelledby="title desc">
  <title id="title">Ebinesh A — full-stack software engineer</title>
  <desc id="desc">An animated terminal: curiosity becomes code, and code becomes something useful. Building products, automating the repetitive, staying curious.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .cursor { animation: breathe 3s ease-in-out infinite; }
    .signal { animation: travel 12s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes travel { 0%,12% { transform: translateX(0); opacity: 0; } 18% { opacity: 1; } 82% { opacity: 1; } 90%,100% { transform: translateX(754px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor,.signal { animation: none; } .signal { display: none; } }
  </style>
  <rect x="1" y="1" width="878" height="278" rx="16" fill="#101820" stroke="#33434f" stroke-width="2"/>
  <path d="M1 44H879" stroke="#33434f"/>
  <circle cx="26" cy="23" r="5" fill="#f28b82"/>
  <circle cx="44" cy="23" r="5" fill="#f6c177"/>
  <circle cx="62" cy="23" r="5" fill="#70d6b4"/>
  <text x="440" y="28" fill="#a5b8c6" text-anchor="middle" font-size="12">ebinesh@workbench: ~</text>
  <text x="38" y="85" fill="#70d6b4" font-size="14">$ whoami</text>
  <text x="38" y="132" fill="#f4f0e8" font-size="40" font-weight="700" letter-spacing="2">EBINESH A</text>
  <text x="39" y="162" fill="#a5b8c6" font-size="15">Full-stack software engineer · curious by default.</text>
  <text x="38" y="207" fill="#70d6b4" font-size="16">curiosity</text>
  <text x="137" y="207" fill="#718b9e" font-size="16">→</text>
  <text x="163" y="207" fill="#f6c177" font-size="16">code</text>
  <text x="213" y="207" fill="#718b9e" font-size="16">→</text>
  <text x="239" y="207" fill="#f4f0e8" font-size="16">something useful.</text>
  <rect class="cursor" x="414" y="192" width="9" height="18" rx="1" fill="#70d6b4"/>
  <path d="M39 231H841" stroke="#33434f"/>
  <rect class="signal" x="39" y="230" width="48" height="2" rx="1" fill="#70d6b4"/>
  <text x="39" y="256" fill="#a5b8c6" font-size="12">build products. automate the repetitive. stay curious.</text>
  <text x="841" y="256" fill="#70d6b4" text-anchor="end" font-size="12">:)</text>
</svg>
